name: ChatGPT share recovery

on:
  push:
    branches:
      - chatgpt-share-recovery-20260904
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fetch public share page by multiple routes
        shell: bash
        run: |
          set +e
          mkdir -p recovered
          SHARE='https://chatgpt.com/share/6a9b0077-ac80-83ea-a172-872bc7629f84'
          JINA='https://r.jina.ai/https://chatgpt.com/share/6a9b0077-ac80-83ea-a172-872bc7629f84'

          echo '=== direct curl ===' | tee recovered/diagnostics.txt
          curl -L --compressed -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36' \
            -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' \
            -sS -D recovered/direct_headers.txt -o recovered/direct_share.html \
            -w 'status=%{http_code} size=%{size_download} final=%{url_effective}\n' "$SHARE" \
            | tee -a recovered/diagnostics.txt
          wc -c recovered/direct_share.html 2>/dev/null | tee -a recovered/diagnostics.txt
          grep -o 'streamController.enqueue' recovered/direct_share.html 2>/dev/null | wc -l | sed 's/^/turbo_enqueue_count=/' | tee -a recovered/diagnostics.txt

          echo '=== jina reader ===' | tee -a recovered/diagnostics.txt
          curl -L --compressed -A 'Mozilla/5.0' -sS -D recovered/jina_headers.txt \
            -o recovered/jina_share.txt -w 'status=%{http_code} size=%{size_download}\n' "$JINA" \
            | tee -a recovered/diagnostics.txt
          wc -c recovered/jina_share.txt 2>/dev/null | tee -a recovered/diagnostics.txt
          head -c 500 recovered/jina_share.txt 2>/dev/null > recovered/jina_head.txt

          python - <<'PY'
          import json, re
          from pathlib import Path

          out = Path('recovered')
          html_path = out/'direct_share.html'
          if not html_path.exists():
              print('NO_DIRECT_HTML')
              raise SystemExit(0)
          html = html_path.read_text(encoding='utf-8', errors='replace')
          print('DIRECT_HTML_CHARS', len(html))

          encoded = re.findall(r'streamController\.enqueue\(("(?:\\.|[^"\\])*")\)', html, flags=re.S)
          print('ENCODED_CHUNKS', len(encoded))
          if not encoded:
              print('NO_TURBO_STREAM_FOUND')
              raise SystemExit(0)

          try:
              stream_text = ''.join(json.loads(s) for s in encoded)
              (out/'turbo_stream.txt').write_text(stream_text, encoding='utf-8')
              first_line = stream_text.split('\n',1)[0]
              table = json.loads(first_line)
              print('TABLE_TYPE', type(table).__name__, 'TABLE_LEN', len(table) if isinstance(table,list) else -1)
          except Exception as e:
              print('TURBO_DECODE_ERROR', repr(e))
              raise SystemExit(0)

          SENT={-1:None,-2:None,-3:None,-4:None,-5:None,-6:False,-7:True}
          memo={}
          def resolve(v):
              if not isinstance(v,int): return v
              if v<0: return SENT.get(v)
              if v in memo: return memo[v]
              if not isinstance(table,list) or v>=len(table): return v
              raw=table[v]
              if isinstance(raw,dict):
                  obj={}; memo[v]=obj
                  for k,item in raw.items():
                      key=k
                      if isinstance(k,str) and k.startswith('_') and k[1:].isdigit():
                          key=resolve(int(k[1:]))
                      obj[key]=resolve(item)
                  return obj
              if isinstance(raw,list):
                  if raw and raw[0]=='P': memo[v]=None; return None
                  arr=[]; memo[v]=arr; arr.extend(resolve(x) for x in raw); return arr
              memo[v]=raw; return raw

          try:
              root=resolve(0)
          except Exception as e:
              print('RESOLVE_ERROR', repr(e))
              raise SystemExit(0)

          def find_linear(x):
              stack=[x]; seen=set()
              while stack:
                  v=stack.pop(); oid=id(v)
                  if oid in seen: continue
                  seen.add(oid)
                  if isinstance(v,dict):
                      c=v.get('linear_conversation')
                      if isinstance(c,list): return c
                      stack.extend(v.values())
                  elif isinstance(v,list): stack.extend(v)
              return None

          conv=find_linear(root)
          print('LINEAR_FOUND', bool(conv), 'LEN', len(conv) if conv else 0)
          if not conv: raise SystemExit(0)

          def text_from_content(c):
              if not isinstance(c,dict): return ''
              parts=c.get('parts')
              if isinstance(parts,list):
                  vals=[]
                  for p in parts:
                      if isinstance(p,str): vals.append(p)
                      elif isinstance(p,dict) and isinstance(p.get('text'),str): vals.append(p['text'])
                  return '\n'.join(vals).strip()
              for key in ('text','result','output'):
                  if isinstance(c.get(key),str): return c[key].strip()
              return ''

          msgs=[]
          for pos,node in enumerate(conv):
              if not isinstance(node,dict): continue
              m=node.get('message')
              if not isinstance(m,dict): continue
              a=m.get('author') or {}
              role=a.get('role') if isinstance(a,dict) else None
              if role not in {'user','assistant'}: continue
              if (m.get('recipient') or 'all')!='all': continue
              text=text_from_content(m.get('content') or {})
              if not text: continue
              msgs.append({'index':len(msgs),'source_position':pos,'id':m.get('id'),'role':role,'create_time':m.get('create_time'),'text':text})

          print('RECOVERED_MESSAGES', len(msgs))
          if not msgs: raise SystemExit(0)
          (out/'messages.json').write_text(json.dumps(msgs,ensure_ascii=False,indent=2),encoding='utf-8')
          first=next((m for m in msgs if m['role']=='user'),None)
          if first:
              (out/'first_user_message.txt').write_text(first['text'],encoding='utf-8')
              print('FIRST_USER_CHARS',len(first['text']))

          blocks=[]; outline=['# Conversation Outline','']
          for m in msgs:
              blocks.append(f"## Turn {m['index']+1} — {m['role'].upper()}\n\n{m['text'].rstrip()}\n")
              preview=re.sub(r'\s+',' ',m['text']).strip()
              if len(preview)>180: preview=preview[:177]+'...'
              outline.append(f"- **Turn {m['index']+1} — {m['role'].title()}** ({len(m['text']):,} chars): {preview}")
          (out/'conversation.md').write_text('\n'.join(blocks),encoding='utf-8')
          (out/'outline.md').write_text('\n'.join(outline)+'\n',encoding='utf-8')

          cdir=out/'chunks'; cdir.mkdir(exist_ok=True)
          target=120000; cur=[]; size=0; n=1
          for m in msgs:
              b=f"## Turn {m['index']+1} — {m['role'].upper()}\n\n{m['text'].rstrip()}\n\n"
              if cur and size+len(b)>target:
                  (cdir/f'part_{n:03d}.md').write_text(''.join(cur),encoding='utf-8'); n+=1; cur=[]; size=0
              cur.append(b); size+=len(b)
          if cur: (cdir/f'part_{n:03d}.md').write_text(''.join(cur),encoding='utf-8')
          print('CHUNKS',n,'TOTAL_TEXT_CHARS',sum(len(m['text']) for m in msgs))
          PY

      - name: Upload recovery diagnostics and outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-share-recovered
          path: recovered/
          retention-days: 1
